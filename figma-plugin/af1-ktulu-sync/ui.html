<style>
  :root { --lava: #ff2d00; --ink: var(--figma-color-text, #2b2929); --muted: var(--figma-color-text-secondary, #767373); --line: var(--figma-color-border, #e0dddd); --bg2: var(--figma-color-bg-secondary, #f5f2f2); }
  body { font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--ink); margin: 0; padding: 14px; background: var(--figma-color-bg, #fff); }
  h1 { font-size: 15px; margin: 0; } p { margin: 4px 0 10px; color: var(--muted); }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); }
  button { border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; background: var(--bg2); color: var(--ink); }
  button.primary { background: var(--lava); color: #fff; } button.big { width: 100%; padding: 12px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .status { padding: 10px 12px; border-radius: 8px; background: var(--bg2); margin: 10px 0; }
  .item { display: flex; gap: 8px; align-items: flex-start; border-top: 1px solid var(--line); padding: 8px 0; }
  .item:first-child { border-top: 0; }
  .k { font-size: 11px; color: var(--muted); } .v { white-space: pre-wrap; }
  .chip { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--bg2); }
  .chip.c { background: var(--lava); color: #fff; }
  #list { max-height: 300px; overflow: auto; }
  #progress { color: var(--lava); font-weight: 600; min-height: 16px; }
  #log { font-size: 11px; color: var(--muted); white-space: pre-wrap; margin-top: 8px; max-height: 90px; overflow: auto; }
  .err { color: var(--lava); }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); }
</style>
<h1>AF1 Ktulu Sync · Singapore</h1>
<p>Figma, the AF1 Tool and staging stay in the same state.</p>

<div id="tokenBox" hidden>
  <p>Paste your plugin token (AF1 Tool → Team Cards → Sitemap Sync → "Figma plugin token").</p>
  <div class="row"><input type="text" id="token" placeholder="token" /><button class="primary" id="saveToken">Connect</button></div>
</div>

<div id="main" hidden>
  <div class="status" id="status">…</div>
  <div id="progress"></div>
  <div id="buildBox"></div>
  <div id="changes"></div>
  <details>
    <summary>Settings</summary>
    <div class="row"><label><input type="checkbox" id="live"> Live sync every 20 s while this window is open</label></div>
    <div class="row"><button id="rebuild">Rebuild all screens</button><button id="changeToken">Change token</button></div>
  </details>
</div>
<div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (type, extra = {}) => parent.postMessage({ pluginMessage: { type, ...extra } }, "*");
  const reply = (reqId, result, error) => parent.postMessage({ pluginMessage: { reqId, result, error } }, "*");
  const log = (s, err) => { const d = document.createElement("div"); d.textContent = new Date().toLocaleTimeString().slice(0, 5) + "  " + s; if (err) d.className = "err"; $("log").prepend(d); };
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const LABEL = { "figma-newer": "Figma → CMS", "cms-newer": "CMS → Figma", conflict: "Both changed" };
  let diffs = [];

  $("saveToken").onclick = () => { log("Connecting …"); post("save-token", { token: $("token").value }); };
  $("changeToken").onclick = () => { $("tokenBox").hidden = false; };
  $("rebuild").onclick = () => { log("Rebuilding all screens …"); post("build"); };
  $("live").onchange = (e) => post("live", { on: e.target.checked });

  function render(m) {
    $("tokenBox").hidden = true; $("main").hidden = false; $("live").checked = m.live;
    $("status").innerHTML = m.built === 0
      ? `<strong>No screens in Figma yet.</strong> ${m.pages} pages are ready on staging.`
      : `<strong>${m.built}/${m.pages} pages in Figma · ${m.inSync}/${m.total} fields in sync.</strong>` + (m.syncedAt ? `<br><span class="k">Last sync ${new Date(m.syncedAt).toLocaleString()}</span>` : "");
    $("buildBox").innerHTML = m.built === 0 ? `<button class="primary big" id="build">Build all ${m.pages} pages in Figma</button>` : "";
    if (m.built === 0) $("build").onclick = () => { log("Building …"); post("build"); };
    diffs = m.diffs;
    if (!diffs.length) { $("changes").innerHTML = m.built ? `<p>Everything is in sync.</p>` : ""; return; }
    $("changes").innerHTML =
      `<div class="row"><strong>${diffs.length} change${diffs.length === 1 ? "" : "s"}</strong><button id="all">Select all</button><button id="none">None</button></div><div id="list">` +
      diffs.map((d, i) => `<div class="item"><input type="checkbox" class="sel" data-i="${i}" ${d.state === "conflict" ? "" : "checked"}><div style="flex:1">
        <div><span class="chip ${d.state === "conflict" ? "c" : ""}">${LABEL[d.state] || d.state}</span> <span class="k">${esc(d.page)} · ${esc(d.layer)}</span></div>
        ${d.kind === "image" ? `<div class="k">Image ${d.state === "figma-newer" ? "replaced in Figma" : "changed in the CMS"}</div>` :
          d.state === "conflict"
            ? `<label><input type="radio" name="c${i}" value="figma" checked> Figma: <span class="v">${esc(d.figma)}</span></label><br><label><input type="radio" name="c${i}" value="cms"> CMS: <span class="v">${esc(d.cms)}</span></label>`
            : `<div class="v">${esc(d.state === "figma-newer" ? d.figma : d.cms)}</div>`}
      </div></div>`).join("") +
      `</div><button class="primary big" id="apply" style="margin-top:8px">Apply selected</button>`;
    $("all").onclick = () => document.querySelectorAll(".sel").forEach((x) => (x.checked = true));
    $("none").onclick = () => document.querySelectorAll(".sel").forEach((x) => (x.checked = false));
    $("apply").onclick = () => {
      const only = [], decisions = {};
      document.querySelectorAll(".sel:checked").forEach((x) => {
        const d = diffs[Number(x.dataset.i)]; only.push(d.key);
        if (d.state === "conflict") decisions[d.key] = (document.querySelector(`input[name=c${x.dataset.i}]:checked`) || {}).value || "figma";
      });
      if (!only.length) return log("Nothing selected.");
      log("Applying " + only.length + " change(s) …"); post("apply", { only, decisions });
    };
  }

  async function toJpeg(blob, maxEdge, q) {
    const bmp = await createImageBitmap(blob);
    const s = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
    return new Uint8Array(await out.arrayBuffer());
  }
  onmessage = async (e) => {
    const m = e.data.pluginMessage; if (!m) return;
    if (m.type === "fetch-image") { try { const r = await fetch(m.url); if (!r.ok) throw new Error("image " + r.status); reply(m.reqId, await toJpeg(await r.blob(), 2400, 0.9)); } catch (err) { reply(m.reqId, null, err.message); } return; }
    if (m.type === "encode-image") { try { const j = await toJpeg(new Blob([new Uint8Array(m.bytes)]), 2400, 0.85); let b = ""; for (let i = 0; i < j.length; i += 0x8000) b += String.fromCharCode.apply(null, j.subarray(i, i + 0x8000)); reply(m.reqId, { base64: btoa(b) }); } catch (err) { reply(m.reqId, null, err.message); } return; }
    if (m.type === "token") { $("token").value = m.token; if (!m.token) $("tokenBox").hidden = false; }
    if (m.type === "checked") render(m);
    if (m.type === "progress") $("progress").textContent = m.msg;
    if (m.type === "synced") log(`Applied: ${m.toCms} to the CMS, ${m.toFigma} into Figma` + (m.open ? `, ${m.open} left` : "") + "." + (m.written.length ? "\n" + m.written.join("\n") : ""));
    if (m.type === "log") log(m.msg);
    if (m.type === "error") { log(m.msg, true); if (/token/i.test(m.msg)) $("tokenBox").hidden = false; }
  };
  post("init");
</script>
